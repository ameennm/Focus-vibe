<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Tapper: Vibe Check</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- CORE STYLES & TYPOGRAPHY --- */
        :root {
            --color-focused: #000080;
            --color-excited: #FFA500;
            --color-calm: #008080;
            --color-tired: #C8C8D8;
            --color-text-dark: #1a1a1a;
            --color-text-light: #fff;
        }
        
        body {
            display: flex; justify-content: center; align-items: stretch; min-height: 100vh; margin: 0;
            font-family: 'Montserrat', sans-serif; color: var(--color-text-dark); line-height: 1.6;
            -webkit-user-select: none; user-select: none; touch-action: manipulation;
        }

        #game-container {
            width: 100%; max-width: 600px; min-height: 100vh;
            background-color: #fff; display: flex; flex-direction: column; position: relative;
        }
        
        /* Typography for Headings */
        h1, h2, h3 { font-family: 'Oswald', sans-serif; letter-spacing: 1px; font-weight: 700; }

        .screen {
            width: 100%; height: 100%; min-height: 100vh; position: relative;
            padding: 30px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            transition: background-color 0.5s, color 0.5s, opacity 0.3s ease-in-out; 
            overflow-y: auto;
        }
        .screen.hidden { opacity: 0; position: absolute; visibility: hidden; }

        button {
            padding: 14px 30px; font-size: 1.1em; background: var(--color-text-dark); color: var(--color-text-light); border: none; border-radius: 8px; cursor: pointer;
            margin-top: 20px; transition: background-color 0.15s, transform 0.1s; font-weight: 600; width: 100%; max-width: 300px;
        }
        
        button:active { transform: scale(0.98); }
        
        /* --- LANDING PAGE --- */
        #landing-area { padding-top: 80px; text-align: center; }
        
        /* Inputs */
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; margin-bottom: 15px; 
            transition: border-color 0.2s; max-width: 300px;
        }
        input:focus { border-color: var(--color-primary); outline: none; }

        /* --- GAME PLAY SCREEN (Black & White) --- */
        #game-area { background-color: black; color: white; cursor: crosshair; justify-content: center; }
        #game-info { position: absolute; top: 20px; width: calc(100% - 40px); display: flex; justify-content: space-between; font-size: 1.2em; }
        
        #target { 
            position: absolute; width: 85px; height: 85px; border-radius: 50%; background-color: white; border: 6px solid black; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); display: none; cursor: pointer; 
            animation: pulse 0.5s infinite alternate; z-index: 2; /* Ensure target is tappable */
        }
        #instruction { position: absolute; bottom: 20px; color: white; font-size: 1.1em; }
        
        /* Game Start Cue Overlay */
        #start-cue-overlay { background: rgba(0, 0, 0, 0.95); z-index: 1000; }
        #cue-arrow { font-size: 8em; color: white; animation: bounce 1s infinite; }
        
        /* --- RESULT SCREEN (Color Reveal) --- */
        #result-area { text-align: center; justify-content: center; }
        #result-area h2 { font-size: 2.5em; margin-bottom: 15px; }
        
        #explanation-text { padding: 10px; font-size: 1.1em; margin-top: 20px; }
        
        #stats-info { margin-top: 30px; font-size: 0.9em; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="landing-area" class="screen">
            <h1>Mood Tapper 🧠</h1>
            <h2>Simple Cognitive Vibe Check</h2>
            
            <p style="margin-top: 30px; margin-bottom: 30px; opacity: 0.8;">
                Enter your details to calibrate the test (Age is required to set your performance baseline).
            </p>

            <div id="input-group">
                <input type="text" id="user-name" placeholder="Your Name" required>
                <input type="number" id="user-age" min="10" max="100" placeholder="Your Age (Required)" required>
                <select id="user-gender">
                    <option value="" disabled selected>Select Gender (Optional)</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Non-binary/Other</option>
                </select>
            </div>
            
            <button id="get-started-button" disabled>START VIBE CHECK</button>
        </div>

        <div id="game-area" class="screen hidden">
            <div id="game-info">
                <span id="timer">TIME: 30</span>
                <span id="score">SCORE: 0</span>
            </div>
            <div id="target"></div>
            <p id="instruction"></p>
            
            <div id="start-cue-overlay" class="hidden">
                <p id="cue-text">Tap the circle to begin!</p>
                <div id="cue-arrow">👆</div>
            </div>
        </div>
        
        <div id="result-area" class="screen hidden">
            <h2 id="mood-title"></h2>
            
            <p id="explanation-text"></p>
            
            <p id="task-text" style="font-weight: 600; margin-top: 30px;"></p>

            <div id="stats-info">
                <p>Avg. RT: <span id="final-art">0ms</span> | Consistency (&sigma;): <span id="final-sigma">0ms</span> | Score: <span id="final-score">0</span></p>
            </div>
            
            <button id="restart-button">RE-ANALYZE</button>
        </div>
    </div>
    
    <script>
        const GAME_DURATION = 30; 
        const MIN_TAPS_FOR_ANALYSIS = 10;
        const T_SIGMA = 70; 
        
        let userName = '';
        let userAge = 0; 
        let baselineART = 0;

        // UI Elements
        const nameInput = document.getElementById('user-name');
        const ageInput = document.getElementById('user-age');
        const genderSelect = document.getElementById('user-gender');
        const getStartedButton = document.getElementById('get-started-button');
        const gameArea = document.getElementById('game-area');
        const target = document.getElementById('target');
        const startCueOverlay = document.getElementById('start-cue-overlay');
        const restartButton = document.getElementById('restart-button');
        const resultArea = document.getElementById('result-area');

        // Game State & Metrics
        let gameState = {
            running: false, score: 0, timeRemaining: GAME_DURATION, timerInterval: null, targetTimeout: null, targetAppearanceTime: 0, reactionTimes: [], pvtResults: null
        };

        // --- SCIENTIFIC DATA & LOGIC ---
        function getAgeAdjustedBaselineART(age) {
            if (age < 25) return 220; if (age < 40) return 250; if (age < 60) return 280; return 320; 
        }

        const MoodMap = {
            'FOCUSED_FLOWING': { name: 'Focused & Flowing 🚀', color: 'var(--color-focused)', textColor: 'white', task: 'Tackle the most important item on your to-do list for 30 minutes.', explanation: 'Optimal Focus: Fast & Consistent tapping shows peak alertness.' },
            'EXCITED_ENERGETIC': { name: 'Excited & Energetic ⚡', color: 'var(--color-excited)', textColor: 'black', task: 'Go for a 15-minute walk to stabilize your energy.', explanation: 'High Arousal: Fast but erratic performance indicates high energy that needs structure.' },
            'CALM_MELLOW': { name: 'Calm & Mellow 🧘', color: 'var(--color-calm)', textColor: 'white', task: 'Ready for detail work. Read an article to gently activate the mind.', explanation: 'Stable Pace: Slow but consistent performance indicates a deliberate, steady state.' },
            'TIRED_DISPERSED': { name: 'Tired & Dispersed 😴', color: 'var(--color-tired)', textColor: 'black', task: 'Prioritize recovery. Practice 4-7-8 breathing 5 times.', explanation: 'Fatigue/Stress: Slow and erratic performance suggests significant cognitive load.' }
        };

        function calculateKPIs() {
            const N = gameState.reactionTimes.length;
            if (N < MIN_TAPS_FOR_ANALYSIS) { return { ART: 0, Sigma: Infinity, valid: false }; }
            const sumR = gameState.reactionTimes.reduce((acc, R_i) => acc + R_i, 0);
            const ART = sumR / N;
            const sumSquaredDiffs = gameState.reactionTimes.reduce((acc, R_i) => acc + (R_i - ART) ** 2, 0);
            const variance = sumSquaredDiffs / N;
            const Sigma = Math.sqrt(variance);
            return { ART: Math.round(ART), Sigma: Math.round(Sigma), valid: true };
        }

        function mapKPIsToMood(pvt) {
            if (!pvt.valid) return { ...MoodMap.TIRED_DISPERSED, name: 'Inconclusive Data ⚠️', explanation: 'Insufficient taps recorded. Try again for a full report.' };
            
            const ART = pvt.ART; const Sigma = pvt.Sigma;
            const isFast = ART <= (baselineART * 0.95);
            const isSlow = ART >= (baselineART * 1.05);
            const isConsistent = Sigma <= T_SIGMA;

            if (isFast && isConsistent) return MoodMap.FOCUSED_FLOWING;
            if (isFast && !isConsistent) return MoodMap.EXCITED_ENERGETIC;
            if (isSlow && isConsistent) return MoodMap.CALM_MELLOW;
            
            return MoodMap.TIRED_DISPERSED; 
        }


        // --- GAME FLOW / UX IMPLEMENTATION ---
        function showScreen(id) {
            const currentScreen = document.querySelector('.screen:not(.hidden)');
            const nextScreen = document.getElementById(id);

            if (currentScreen) {
                currentScreen.style.opacity = 0;
                setTimeout(() => {
                    currentScreen.classList.add('hidden');
                    nextScreen.classList.remove('hidden');
                    nextScreen.style.opacity = 1;
                }, 300);
            } else {
                nextScreen.classList.remove('hidden');
                nextScreen.style.opacity = 1;
            }
        }
        
        function startTimer() {
            gameState.timerInterval = setInterval(() => {
                gameState.timeRemaining--;
                document.getElementById('timer').textContent = `TIME: ${gameState.timeRemaining}`;
                if (gameState.timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function spawnTarget() {
            if (!gameState.running) return;
            const targetDuration = Math.random() * 1500 + 500; 

            const targetSize = 85;
            const padding = 30;
            const infoHeight = 70;
            const instructionHeight = 70;

            const max_x = gameArea.clientWidth - targetSize - (2 * padding);
            const max_y = gameArea.clientHeight - targetSize - infoHeight - instructionHeight; 
            const randomX = Math.random() * max_x + padding;
            const randomY = Math.random() * max_y + infoHeight; 

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
            target.style.display = 'block';
            gameState.targetAppearanceTime = performance.now(); 

            gameState.targetTimeout = setTimeout(() => {
                if (target.style.display !== 'none') {
                    document.getElementById('instruction').textContent = 'Too Slow! (-1)';
                    gameState.score = Math.max(0, gameState.score - 1); 
                    document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
                    target.style.display = 'none';
                    setTimeout(spawnTarget, 200); 
                }
            }, targetDuration);
        }
        
        function handleTargetTap(event) {
            event.stopPropagation();
            if (!gameState.running) return;
            clearTimeout(gameState.targetTimeout);
            
            const tapTime = performance.now();
            const rt = Math.round(tapTime - gameState.targetAppearanceTime);

            gameState.reactionTimes.push(rt);
            
            gameState.score++;
            document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
            document.getElementById('instruction').textContent = 'Hit! (+1)';

            target.style.display = 'none';
            setTimeout(spawnTarget, 50); 
        }
        
        function handleMissedTap() {
            if (!gameState.running) return;
            gameState.score = Math.max(0, gameState.score - 1); 
            document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
            document.getElementById('instruction').textContent = 'Missed area. (-1)';
        }

        function startTestTimer(event) {
            event.stopPropagation();
            
            // Revert UX elements
            target.removeEventListener('click', startTestTimer);
            startCueOverlay.classList.add('hidden');
            
            gameState.running = true; 
            
            // Set main game handlers
            target.addEventListener('click', handleTargetTap);
            gameArea.onclick = handleMissedTap;
            
            startTimer();
            spawnTarget();
        }

        function startGame() {
            // Check & Calibrate
            userName = nameInput.value.trim();
            userAge = parseInt(ageInput.value, 10);
            baselineART = getAgeAdjustedBaselineART(userAge);
            
            // Reset state
            gameState = { running: false, score: 0, timeRemaining: GAME_DURATION, timerInterval: null, targetTimeout: null, targetAppearanceTime: 0, reactionTimes: [], pvtResults: null };
            
            showScreen('game-area');
            document.getElementById('instruction').textContent = '';
            document.getElementById('timer').textContent = `TIME: ${GAME_DURATION}`;
            document.getElementById('score').textContent = `SCORE: 0`;

            // Display Animated Cue
            startCueOverlay.classList.remove('hidden');
            target.style.display = 'block'; 
            
            // Attach listener to target dot for the game start cue
            target.addEventListener('click', startTestTimer);
        }

        function endGame() {
            gameState.running = false;
            gameState.pvtResults = calculateKPIs(); 
            
            const resultMood = mapKPIsToMood(gameState.pvtResults);
            
            // Render Results
            resultArea.style.backgroundColor = resultMood.color;
            resultArea.style.color = resultMood.textColor;
            document.getElementById('mood-title').textContent = resultMood.name;
            document.getElementById('explanation-text').textContent = resultMood.explanation;
            document.getElementById('task-text').textContent = `ACTION PLAN: ${resultMood.task}`;

            // Display Stats
            document.getElementById('final-art').textContent = `${gameState.pvtResults.ART}ms`;
            document.getElementById('final-sigma').textContent = `${gameState.pvtResults.Sigma}ms`;
            document.getElementById('final-score').textContent = gameState.score;

            showScreen('result-area');
        }

        function checkInputsCalibration() {
            const ageValid = parseInt(nameInput.value, 10) >= 10 && parseInt(ageInput.value, 10) <= 100;
            const nameValid = nameInput.value.trim().length >= 2;
            getStartedButton.disabled = !(ageValid && nameValid);
        }

        function initializeListeners() {
            getStartedButton.onclick = startGame;
            restartButton.onclick = () => { showScreen('landing-area'); };

            nameInput.addEventListener('input', checkInputsCalibration);
            ageInput.addEventListener('input', checkInputsCalibration);
            
            showScreen('landing-area');
        }

        document.addEventListener('DOMContentLoaded', initializeListeners);
    </script>
</body>
</html>
