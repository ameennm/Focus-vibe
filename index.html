<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Crush & Stack City (Three.js + Cannon.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2e3b5e; }
        #game-info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10;
        }
        #score-display { font-size: 2em; font-weight: bold; color: #ff9900; }
        #tap-message {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #e94560;
            font-size: 1.2em;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-info">
        <div>Score: <span id="score-display">0</span></div>
        <div id="level-display">Level: 1</div>
    </div>
    <div id="tap-message">TAP ANYWHERE TO SWING THE BALL!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.17.0/dist/cannon-es.min.js"></script>

    <script>
        // --- Game Setup & State ---
        let scene, camera, renderer, world;
        let pendulumLine, wreckingBallMesh, wreckingBallBody;
        let blocks = [];
        let gameState = {
            score: 0,
            level: 1,
            buildingHeight: 0,
            isSwinging: false,
            pendulumTimer: 0,
            ballHitCooldown: false,
            blockRemovalQueue: []
        };
        const BLOCK_SIZE = 1;
        const BLOCK_HEIGHT = 0.5;
        const PENDULUM_LENGTH = 15;
        const MAX_SWING_ANGLE = Math.PI / 4; // 45 degrees

        // --- Utility Functions ---

        function updateUI() {
            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('level-display').textContent = `Level: ${gameState.level}`;
        }

        function createBlock(x, y, z) {
            // Three.js Mesh
            const geometry = new THREE.BoxGeometry(BLOCK_SIZE * 2, BLOCK_HEIGHT, BLOCK_SIZE);
            const material = new THREE.MeshPhongMaterial({ color: 0x337f7f, shininess: 30 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // Cannon.js Body
            const shape = new CANNON.Box(new CANNON.Vec3(BLOCK_SIZE, BLOCK_HEIGHT / 2, BLOCK_SIZE / 2));
            const body = new CANNON.Body({
                mass: 1,
                shape: shape,
                position: new CANNON.Vec3(x, y, z),
                material: new CANNON.Material({ friction: 0.5, restitution: 0.2 })
            });
            body.allowSleep = true;
            world.addBody(body);

            blocks.push({ mesh, body });
            return { mesh, body };
        }

        function buildNewLevel() {
            const blockY = gameState.buildingHeight + BLOCK_HEIGHT / 2;
            createBlock(0, blockY, 0);
            gameState.buildingHeight += BLOCK_HEIGHT;
            gameState.level++;
            updateUI();
        }

        // --- Core Setup ---

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2e3b5e);

            // Camera (Mobile-friendly perspective)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, PENDULUM_LENGTH / 2, PENDULUM_LENGTH * 0.8);
            camera.lookAt(0, PENDULUM_LENGTH / 2, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0x404040, 5);
            scene.add(ambient);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Cannon.js World
            world = new CANNON.World({
                gravity: new CANNON.Vec3(0, -9.82, 0)
            });
            world.broadphase = new CANNON.SAPBroadphase(world);

            // Wrecking Ball (The Pendulum)
            const ballRadius = 0.5;
            wreckingBallMesh = new THREE.Mesh(
                new THREE.SphereGeometry(ballRadius, 32, 32),
                new THREE.MeshPhongMaterial({ color: 0xcc0000, shininess: 100 })
            );
            scene.add(wreckingBallMesh);

            const ballShape = new CANNON.Sphere(ballRadius);
            wreckingBallBody = new CANNON.Body({
                mass: 5,
                shape: ballShape,
                position: new CANNON.Vec3(0, PENDULUM_LENGTH, 0),
                type: CANNON.Body.KINEMATIC // Starts as kinematic (controlled by code)
            });
            world.addBody(wreckingBallBody);

            // Pendulum Pivot (fixed point in space)
            const pivotBody = new CANNON.Body({ mass: 0 }); // Immovable
            pivotBody.position.set(0, PENDULUM_LENGTH, 0);
            world.addBody(pivotBody);

            // Pendulum Constraint (hinge at the top)
            const constraint = new CANNON.PointToPointConstraint(
                wreckingBallBody, new CANNON.Vec3(0, 0, 0),
                pivotBody, new CANNON.Vec3(0, 0, 0)
            );
            world.addConstraint(constraint);

            // Line/Rope Visual (Simplified)
            pendulumLine = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, PENDULUM_LENGTH, 0), new THREE.Vector3(0, 0, 0)]),
                new THREE.LineBasicMaterial({ color: 0xaaaaaa })
            );
            scene.add(pendulumLine);

            // Initial Building (Start with a few base blocks)
            for (let i = 0; i < 5; i++) {
                buildNewLevel();
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', handleTap);
        }

        // --- Game Logic ---

        function handleTap() {
            if (gameState.ballHitCooldown) return;

            // 1. Convert the ball to a dynamic body (Massive change in state!)
            // This is the "release" or "swing" action, giving it velocity.
            wreckingBallBody.type = CANNON.Body.DYNAMIC;
            wreckingBallBody.mass = 5; // Give it a real mass
            wreckingBallBody.wakeUp();

            // 2. Apply a strong impulse (the swing)
            const impulseStrength = 50;
            const velocityVector = new CANNON.Vec3(
                Math.cos(gameState.pendulumTimer * 0.05) * impulseStrength, // Swing component
                0,
                0
            );
            wreckingBallBody.applyImpulse(velocityVector, wreckingBallBody.position);

            gameState.isSwinging = true;
            gameState.ballHitCooldown = true; // Prevent immediate re-swinging
            document.getElementById('tap-message').style.display = 'none';

            // Reset the ball's kinematic state after a short period (for the next turn)
            setTimeout(() => {
                wreckingBallBody.type = CANNON.Body.KINEMATIC;
                wreckingBallBody.position.set(0, PENDULUM_LENGTH, 0);
                wreckingBallBody.velocity.set(0, 0, 0);
                wreckingBallBody.angularVelocity.set(0, 0, 0);
                wreckingBallBody.sleep();
                gameState.isSwinging = false;
                gameState.ballHitCooldown = false;
                document.getElementById('tap-message').style.display = 'block';
            }, 3000); // 3 seconds to complete the swing and reset
        }
        
        // --- Collision Logic (The Crush Mechanic) ---
        wreckingBallBody.addEventListener('collide', (e) => {
            if (gameState.ballHitCooldown) {
                const collidedBody = e.body;
                const blockToCrush = blocks.find(b => b.body === collidedBody);

                if (blockToCrush) {
                    // Simple Crush Condition: If the collision velocity is high
                    const impulseMagnitude = e.contact.getImpactVelocityAlongNormal();
                    
                    // Critical Velocity for a Crush
                    if (impulseMagnitude > 0.5) { 
                        // Target the lowest block currently in play (for game flow)
                        const targetBlock = blocks[0]; 

                        if (blockToCrush.body === targetBlock.body) {
                            
                            // Success: Remove the block and award score
                            gameState.score += 100;
                            updateUI();
                            
                            // 1. Convert the crushed block to be highly dynamic and explode
                            targetBlock.body.mass = 0.5;
                            targetBlock.body.type = CANNON.Body.DYNAMIC;
                            targetBlock.body.applyImpulse(new CANNON.Vec3(Math.random() * 5 - 2.5, 5, Math.random() * 5 - 2.5), targetBlock.body.position);
                            
                            // 2. Add to removal queue
                            gameState.blockRemovalQueue.push(targetBlock);
                            blocks.shift(); // Remove the target block from the active list

                            // 3. Prepare next level
                            buildNewLevel();
                        } else {
                            // Hit a block that wasn't the target (CRASH!)
                            // In a full game, this would stop the swing and end the game.
                            wreckingBallBody.velocity.set(0,0,0); // Stop the ball
                        }
                    }
                }
            }
        });

        // --- Rendering Loop ---

        function animate() {
            requestAnimationFrame(animate);

            const dt = 1/60; // Fixed timestep for physics
            world.step(dt);

            // Update Cannon.js object positions to Three.js meshes
            for (const { mesh, body } of blocks) {
                mesh.position.copy(body.position);
                mesh.quaternion.copy(body.quaternion);
            }
            
            // Handle Ball Movement (Kinematic when not swinging)
            if (!gameState.isSwinging && !gameState.ballHitCooldown) {
                // Simple sine wave for visual 'ready' swing
                gameState.pendulumTimer += 0.05;
                const angle = MAX_SWING_ANGLE * Math.sin(gameState.pendulumTimer);

                // Calculate X/Y position of the ball using polar coordinates
                const ballX = PENDULUM_LENGTH * Math.sin(angle);
                const ballY = PENDULUM_LENGTH * (1 - Math.cos(angle)) + (PENDULUM_LENGTH/2); // Center the pivot point visually

                wreckingBallBody.position.set(ballX, ballY, 0);
                wreckingBallMesh.position.copy(wreckingBallBody.position);
                
                // Update the visual line
                pendulumLine.geometry.setFromPoints([
                    new THREE.Vector3(0, PENDULUM_LENGTH, 0), 
                    wreckingBallMesh.position
                ]);
                pendulumLine.geometry.attributes.position.needsUpdate = true;
            } else {
                // When dynamic, update mesh from body position
                wreckingBallMesh.position.copy(wreckingBallBody.position);
            }

            // Cleanup blocks that have fallen out of view
            gameState.blockRemovalQueue = gameState.blockRemovalQueue.filter(item => {
                if (item.body.position.y < -5) {
                    scene.remove(item.mesh);
                    world.removeBody(item.body);
                    return false; // Remove from queue
                }
                return true; // Keep in queue
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // --- Start the App ---
        init();
        animate();
    </script>
</body>
</html>
